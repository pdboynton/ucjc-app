<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0A1628" id="meta-theme"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Convocation"/>
  <title>UCJC Apostolic</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    /* ══════════════════════════════════════════════
       DARK THEME (default)
    ══════════════════════════════════════════════ */
    :root {
      --bg-deep:   #080f1e;
      --bg-mid:    #112240;
      --bg-card:   #192d4a;
      --bg-light:  #1e3a5f;
      --gold:      #C9A84C;
      --gold-light:#E4C46A;
      --crimson:   #8B2635;
      --text-primary: #F0E8D8;
      --text-muted:   #8FA3BF;
      --text-dim:     #4a6280;
      --border:      rgba(201,168,76,0.18);
      --border-soft:  rgba(255,255,255,0.07);
      --shadow:      0 8px 32px rgba(0,0,0,0.5);
      --input-bg:    rgba(255,255,255,0.05);
      --input-border:rgba(255,255,255,0.12);
      --input-focus: rgba(255,255,255,0.08);
      --overlay-bg:  rgba(0,0,0,0.75);
      --radius:  14px;
      --radius-sm: 8px;
      --font-display: 'Playfair Display', serif;
      --font-body:    'Lato', sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ══════════════════════════════════════════════
       LIGHT THEME — warm ivory / parchment
    ══════════════════════════════════════════════ */
    [data-theme="light"] {
      --bg-deep:      #F5EFE3;
      --bg-mid:       #FDFAF5;
      --bg-card:      #FFFFFF;
      --bg-light:     #EDE4D5;
      --gold:         #9A6B14;
      --gold-light:   #B8821A;
      --crimson:      #8B2635;
      --text-primary: #1A1108;
      --text-muted:   #5E4B30;
      --text-dim:     #9E8A6E;
      --border:       rgba(154,107,20,0.20);
      --border-soft:  rgba(0,0,0,0.09);
      --shadow:       0 2px 16px rgba(0,0,0,0.09);
      --input-bg:     rgba(0,0,0,0.035);
      --input-border: rgba(0,0,0,0.13);
      --input-focus:  rgba(0,0,0,0.055);
      --overlay-bg:   rgba(40,20,5,0.50);
    }
    /* Adjust gradients for light theme */
    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(154,107,20,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 85% 100%, rgba(139,38,53,0.05) 0%, transparent 60%);
    }
    [data-theme="light"] .auth-hero {
      background: linear-gradient(160deg, #EDE4D5 0%, #FDFAF5 100%);
    }
    [data-theme="light"] .profile-hero {
      background: linear-gradient(160deg, #EDE4D5, #E5D9C5);
    }
    [data-theme="light"] #convocation-banner {
      background: linear-gradient(135deg, rgba(154,107,20,0.10), rgba(154,107,20,0.03));
    }
    [data-theme="light"] .msg-row.own .msg-bubble {
      background: rgba(154,107,20,0.12); border-color: rgba(154,107,20,0.25);
    }
    [data-theme="light"] .date-tab.active {
      background: linear-gradient(135deg, rgba(154,107,20,0.16), rgba(154,107,20,0.06));
    }

    /* ══════════════════════════════════════════════
       RESET & BASE
    ══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overscroll-behavior: none; }
    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text-primary);
      height: 100%; overflow: hidden;
      position: fixed; width: 100%;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(201,168,76,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 100%, rgba(139,38,53,0.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    [data-theme="light"] body::before { opacity: 1; }

    /* Theme toggle button in header */
    .theme-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border);
      background: var(--input-bg); color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.2s; padding: 0;
    }
    .theme-btn:hover { background: var(--input-focus); color: var(--gold); border-color: var(--gold); }

    /* ══════════════════════════════════════════════
       ICONS — inline SVG system
    ══════════════════════════════════════════════ */
    .icon {
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: currentColor;
    }
    .icon svg { display: block; }

    /* ══════════════════════════════════════════════
       UTILITIES
    ══════════════════════════════════════════════ */
    .hidden { display: none !important; }
    .flex   { display: flex !important; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; border-radius: var(--radius-sm); border: none;
      font-family: var(--font-body); font-weight: 700; font-size: 0.9rem;
      letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary { background: linear-gradient(135deg, var(--gold), #8a5c18); color: #fff; }
    .btn-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--gold); border: 1.5px solid var(--gold); }
    .btn-outline:hover { background: rgba(201,168,76,0.12); }
    .btn-ghost { background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border-soft); }
    .btn-ghost:hover { background: var(--input-focus); }
    .btn-sm { padding: 8px 14px; font-size: 0.8rem; }
    .btn-link {
      background: none; border: none; color: var(--gold); cursor: pointer;
      font-family: var(--font-body); font-size: 0.88rem; text-decoration: underline;
      padding: 0; font-weight: 700;
    }
    .muted-text { color: var(--text-muted); }
    .small-text  { font-size: 0.8rem; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 0.75rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 700;
    }
    input[type=text], input[type=email], input[type=password],
    input[type=number], textarea, select {
      width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
      background: var(--input-bg); border: 1.5px solid var(--input-border);
      color: var(--text-primary); font-family: var(--font-body); font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s; outline: none; -webkit-appearance: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--gold); background: var(--input-focus);
    }
    select option { background: var(--bg-mid); color: var(--text-primary); }
    textarea { resize: vertical; min-height: 80px; }

    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    }
    .badge-gold { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid var(--border); }
    .badge-blue { background: rgba(30,90,150,0.15); color: var(--text-muted); border: 1px solid var(--border-soft); }

    .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; cursor: pointer;
      background: var(--border-soft); border: 1px solid var(--border-soft);
      border-radius: 24px; transition: 0.3s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background: var(--text-dim); border-radius: 50%; transition: 0.3s;
    }
    .toggle input:checked + .toggle-slider { background: var(--gold); border-color: var(--gold); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); background: #fff; }

    /* ══════════════════════════════════════════════
       LOADING OVERLAY
    ══════════════════════════════════════════════ */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg-deep);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      transition: opacity 0.4s ease;
    }
    #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    .loader-logo {
      width: 88px; height: 88px; object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(201,168,76,0.45));
      animation: glow-pulse 2s ease-in-out infinite;
    }
    .loader-ring {
      width: 44px; height: 44px;
      border: 3px solid var(--border-soft);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loader-text {
      font-family: var(--font-display); font-style: italic;
      font-size: 1.05rem; color: var(--text-muted);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow-pulse {
      0%,100% { filter: drop-shadow(0 0 8px rgba(201,168,76,0.35)); }
      50%      { filter: drop-shadow(0 0 24px rgba(201,168,76,0.75)); }
    }
    @keyframes fade-in  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes slide-up { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }

    /* ══════════════════════════════════════════════
       AUTH SCREEN
    ══════════════════════════════════════════════ */
    #auth-screen {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg-deep);
      display: flex; flex-direction: column; overflow-y: auto;
      animation: fade-in 0.3s ease;
    }
    .auth-hero {
      background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-mid) 100%);
      border-bottom: 1px solid var(--border);
      padding: 56px 32px 40px; text-align: center;
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    .auth-hero-logo {
      width: 88px; height: 88px; object-fit: contain;
      display: block; margin: 0 auto 18px;
      filter: drop-shadow(0 0 20px rgba(201,168,76,0.4));
      animation: glow-pulse 3s ease-in-out infinite;
    }
    .auth-hero h1 {
      font-family: var(--font-display); font-size: 1.8rem;
      line-height: 1.25; color: var(--text-primary); margin-bottom: 6px;
    }
    .auth-hero h1 em { color: var(--gold); font-style: italic; }
    .auth-hero p { color: var(--text-muted); font-size: 0.88rem; letter-spacing: 0.04em; }

    .auth-body { padding: 24px 24px 48px; flex: 1; max-width: 480px; margin: 0 auto; width: 100%; }
    .auth-tabs {
      display: flex; margin-bottom: 24px;
      background: var(--input-bg); border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm); padding: 4px; gap: 4px;
    }
    .auth-tab {
      flex: 1; padding: 10px; border: none; background: transparent;
      color: var(--text-muted); font-family: var(--font-body);
      font-weight: 700; font-size: 0.84rem; letter-spacing: 0.06em;
      text-transform: uppercase; border-radius: calc(var(--radius-sm) - 3px);
      cursor: pointer; transition: all 0.2s;
    }
    .auth-tab.active { background: var(--gold); color: #fff; }
    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fade-in 0.2s ease; }

    /* Inline auth error box */
    .auth-error-box {
      background: rgba(139,38,53,0.10); border: 1px solid rgba(139,38,53,0.3);
      border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .auth-error-msg { font-size: 0.88rem; color: var(--crimson); font-weight: 600; }
    .auth-error-hint { font-size: 0.82rem; color: var(--text-muted); }

    /* ══════════════════════════════════════════════
       MAIN APP
    ══════════════════════════════════════════════ */
    #app {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      animation: fade-in 0.3s ease;
    }
    .app-header {
      flex-shrink: 0; background: var(--bg-mid);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      display: flex; align-items: center; gap: 12px;
      position: relative; z-index: 10;
    }
    .app-header-logo {
      width: 30px; height: 30px; object-fit: contain; flex-shrink: 0;
      filter: drop-shadow(0 0 5px rgba(201,168,76,0.4));
    }
    .app-header-title { flex: 1; font-family: var(--font-display); font-size: 1.1rem; color: var(--text-primary); }
    .app-header-title small {
      display: block; font-family: var(--font-body);
      font-size: 0.7rem; color: var(--text-muted); font-style: normal; letter-spacing: 0.05em;
    }
    .header-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8a5c18);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; font-size: 0.84rem;
      cursor: pointer; flex-shrink: 0; border: 2px solid var(--border);
    }

    #convocation-banner {
      flex-shrink: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.10), rgba(201,168,76,0.03));
      border-bottom: 1px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; gap: 12px;
    }
    .banner-info { flex: 1; min-width: 0; }
    .banner-title {
      font-family: var(--font-display); font-size: 0.9rem;
      color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .banner-meta { font-size: 0.74rem; color: var(--text-muted); }
    .banner-refresh {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 1.1rem; padding: 6px; border-radius: 50%; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .banner-refresh:hover { color: var(--gold); background: var(--input-bg); }

    .app-content { flex: 1; overflow: hidden; position: relative; }
    .screen {
      position: absolute; inset: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--safe-bottom) + 24px);
      display: none;
    }
    .screen.active { display: block; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; margin: 18px 0 10px;
    }
    .section-title {
      font-family: var(--font-display); font-size: 1.05rem; color: var(--text-primary);
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::before {
      content: ''; display: inline-block; width: 3px; height: 1em;
      background: var(--gold); border-radius: 2px;
    }

    /* ══════════════════════════════════════════════
       SCHEDULE / EVENT CARDS
    ══════════════════════════════════════════════ */
    .date-tab-list {
      display: flex; gap: 8px; padding: 12px 16px;
      overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
    }
    .date-tab-list::-webkit-scrollbar { display: none; }
    .date-tab {
      flex-shrink: 0; padding: 8px 14px; border-radius: 24px; min-width: 56px;
      background: var(--input-bg); border: 1px solid var(--border-soft);
      cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .date-tab.active { background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.07)); border-color: var(--gold); }
    .date-tab-day { font-size: 0.66rem; letter-spacing: 0.06em; color: var(--text-muted); text-transform: uppercase; }
    .date-tab-num { font-family: var(--font-display); font-size: 1.3rem; color: var(--text-primary); line-height: 1.1; }
    .date-tab.active .date-tab-day, .date-tab.active .date-tab-num { color: var(--gold); }

    .event-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .event-card {
      background: var(--bg-card); border: 1px solid var(--border-soft);
      border-left: 3px solid var(--gold); border-radius: var(--radius);
      padding: 14px; display: flex; gap: 12px; align-items: flex-start;
      cursor: pointer; transition: all 0.18s;
    }
    .event-card:hover { background: var(--bg-light); border-color: var(--border); }
    .event-card:active { transform: scale(0.99); }
    .event-card.bookmarked { border-left-color: var(--gold); background: rgba(201,168,76,0.04); }
    .event-time-col { flex-shrink: 0; text-align: right; min-width: 52px; padding-top: 2px; }
    .event-start { font-size: 0.82rem; font-weight: 700; color: var(--gold); }
    .event-end   { font-size: 0.72rem; color: var(--text-dim); }
    .event-duration { font-size: 0.66rem; color: var(--text-dim); margin-top: 4px; }

    /* Date/day-of-week badge — used on My Schedule bookmarked cards since
       entries there can span multiple different days */
    .event-date-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
      color: var(--gold);
      background: rgba(201,168,76,0.14); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px; margin-bottom: 7px;
    }
    .event-info  { flex: 1; min-width: 0; }
    .event-title { font-family: var(--font-display); font-size: 1rem; color: var(--text-primary); margin-bottom: 4px; line-height: 1.3; }
    .event-location { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .event-desc {
      font-size: 0.78rem; color: var(--text-muted); margin-top: 5px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .event-actions { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .bookmark-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); transition: all 0.2s; padding: 5px;
      display: flex; align-items: center; justify-content: center;
    }
    .bookmark-btn.active { color: var(--gold); }
    .bookmark-saved { font-size: 0.63rem; color: var(--gold); text-align: center; font-weight: 700; }

    .empty-state { text-align: center; padding: 56px 32px; color: var(--text-muted); }
    .empty-icon { margin-bottom: 14px; opacity: 0.35; color: var(--text-dim); }
    .empty-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--text-primary); margin-bottom: 6px; }

    /* ══════════════════════════════════════════════
       FIRESTORE NOTIFICATION CARDS
    ══════════════════════════════════════════════ */
    .notif-card {
      background: var(--bg-card); border: 1px solid var(--border-soft);
      border-radius: var(--radius); padding: 13px 14px;
      display: flex; align-items: flex-start; gap: 12px;
      animation: fade-in 0.2s ease;
    }
    .notif-card.urgent   { border-left: 3px solid var(--crimson); }
    .notif-card.calendar { border-left: 3px solid #2a6496; }
    .notif-card.prayer   { border-left: 3px solid #5c3e8f; }
    .notif-card.announcement { border-left: 3px solid var(--gold); }
    .notif-icon {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      display: f
