<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCJC Apostolic</title>

<style>
    :root{
        --burgundy:#7A1F36;
        --burgundy-dark:#5E1628;
        --gold:#D4AF37;
        --gold-light:#F2D77A;
        --white:#FFFFFF;
        --text:#333333;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg,
            var(--burgundy-dark) 0%,
            var(--burgundy) 45%,
            #8d2a44 100%);
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:420px;
        background:rgba(255,255,255,0.98);
        border-radius:24px;
        padding:32px 24px;
        text-align:center;
        box-shadow:0 15px 40px rgba(0,0,0,0.25);
    }

    h1{
        color:var(--burgundy);
        font-size:2rem;
        font-weight:800;
        margin-bottom:20px;
        letter-spacing:0.5px;
    }

    .logo{
        width:170px;
        max-width:70%;
        height:auto;
        margin:0 auto 24px auto;
        display:block;
    }

    .description{
        background:#faf7ef;
        border:2px solid var(--gold-light);
        border-radius:16px;
        padding:16px;
        color:var(--text);
        font-size:1rem;
        line-height:1.5;
        margin-bottom:28px;
    }

    .btn{
        display:block;
        width:100%;
        text-decoration:none;
        padding:18px 20px;
        margin-bottom:16px;
        border-radius:14px;
        font-size:1.05rem;
        font-weight:700;
        transition:all .2s ease;
        box-shadow:0 6px 15px rgba(0,0,0,0.15);
    }

    .btn-apple{
        background:var(--burgundy);
        color:white;
    }

    .btn-apple:hover{
        background:var(--burgundy-dark);
        transform:translateY(-2px);
    }

    .btn-android{
        background:var(--gold);
        color:#3d2b00;
    }

    .btn-android:hover{
        background:#e3bc45;
        transform:translateY(-2px);
    }

    .footer{
        margin-top:18px;
        color:#777;
        font-size:.85rem;
    }

    @media (max-width: 380px){
        h1{
            font-size:1.7rem;
        }

        .logo{
            width:140px;
        }
    }
</style>
</head>
<body>

<div class="container">

    <h1>UCJC Apostolic</h1>

    <img src="logo512.png" alt="UCJC Apostolic Logo" class="logo">

    <div>
        The official app of the United Church of Jesus Christ
    </div>

    </br>
    <svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <path fill="#000000" d="M256,48C141.125,48,48,141.125,48,256c0,109.813,82.375,200.5,190.469,215.312V323.5H187.625V245.5h50.844v-56.969c0-50.156,30.344-77.781,75.688-77.781c21.844,0,44.5,3.906,44.5,3.906v49.031h-25.063 c-24.813,0-32.531,15.406-32.531,31.25V245.5h57.813l-9.25,78h-48.563v147.812C429.625,456.406,512,365.813,512,256 C512,141.125,418.875,48,304,48C283.562,48,263.625,51.031,245.188,56.719z"/>
    </svg>
    <a href="https://apps.apple.com/us/app/ucjc-apostolic/id6779426953"
       class="btn btn-apple">
        Download for ios
    </a>
    <a href="https://play.google.com/store/apps/details?id=app.vercel.ucjc_app.twa"
       class="btn btn-android">
       ▶ Download for Android
    </a>

    <div class="footer">
        United Church of Jesus Christ (Apostolic)
    </div>

</div>

</body>
</html>
