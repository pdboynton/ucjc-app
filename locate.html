<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Church Near Me</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { max-width: 900px; margin: 0 auto; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; min-width: 200px;}
        select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; white-space: nowrap; }
        button:hover { background-color: #0056b3; }
        .layout { display: flex; gap: 20px; flex-wrap: wrap; }
        #map { height: 400px; flex: 1; min-width: 300px; border-radius: 8px; border: 1px solid #ddd; }
        #church-list { flex: 1; min-width: 300px; max-height: 400px; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .church-item { padding: 15px; border: 1px solid #eee; margin-bottom: 10px; border-radius: 8px; background: #f9f9f9; }
        .church-item h3 { margin: 0 0 5px 0; color: #333; }
        .church-item p { margin: 3px 0; color: #555; font-size: 14px; }
        .distance { font-weight: bold; color: #28a745; margin-top: 5px; }
        .loading { font-style: italic; color: #666; width: 100%; text-align: center; margin-bottom: 15px; font-weight: bold;}
        .no-results { padding: 20px; text-align: center; color: #d9534f; font-weight: bold; background: #fdf7f7; border-radius: 8px; border: 1px solid #f2dede; }
    </style>
</head>
<body>

<div class="container">
    <h2>Find a Church</h2>
    
    <div class="controls">
        <button onclick="useMyLocation()">📍 Use My Location</button>
        <span>OR</span>
        <input type="text" id="manual-location" placeholder="Enter a city or zip code...">
        
        <select id="radius-select">
            <option value="5">Within 5 Miles</option>
            <option value="10">Within 10 Miles</option>
            <option value="15">Within 15 Miles</option>
            <option value="20">Within 20 Miles</option>
            <option value="25" selected>Within 25 Miles</option>
            <option value="30">Within 30 Miles</option>
            <option value="35">Within 35 Miles</option>
            <option value="40">Within 40 Miles</option>
            <option value="45">Within 45 Miles</option>
            <option value="50">Within 50 Miles</option>
        </select>

        <button onclick="useManualLocation()">Search</button>
    </div>

    <div id="status" class="loading">Loading church data...</div>

    <div class="layout">
        <ul id="church-list">
            </ul>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1jI7lYYOWocbwRKK2zoZhvbgpnay9mZllROT_KDoQiUc/gviz/tq?tqx=out:csv";
    
    let churches = [];
    let map, userMarker, churchMarkers = [];
    let lastUsedLat = null;
    let lastUsedLon = null;

    // Initialize Map 
    function initMap() {
        map = L.map('map').setView([40.2201, -74.0321], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
    }

    // Fetch and parse the Google Sheet CSV using PapaParse
    function fetchChurchData() {
        Papa.parse(SHEET_URL, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                const rows = results.data;
                if (rows.length > 0) rows.shift(); // Remove header row
                
                let validCoordsCount = 0;

                for (let i = 0; i < rows.length; i++) {
                    const cols = rows[i];
                    
                    if (cols.length >= 1 && cols[0]) {
                        // Extract and clean Lat/Lon
                        let latVal = parseFloat(cols[3]);
                        let lonVal = parseFloat(cols[4]);

                        let church = {
                            name: cols[0] || "Unknown Church",
                            address: cols[1] || "No Address Provided",
                            phone: cols[2] || "No Phone Provided",
                            lat: !isNaN(latVal) ? latVal : null,
                            lon: !isNaN(lonVal) ? lonVal : null,
                            distance: null
                        };
                        
                        if (church.lat !== null && church.lon !== null) {
                            validCoordsCount++;
                        }
                        
                        churches.push(church);
                    }
                }
                
                document.getElementById('status').innerText = `Ready! Loaded ${churches.length} churches (${validCoordsCount} have valid coordinates).`;
                console.log("Church Data Loaded:", churches); // View in browser console for debugging
            },
            error: function(error) {
                document.getElementById('status').innerText = "Error parsing Google Sheet data.";
                console.error(error);
            }
        });
    }

    // Geocode user's manual input (City/Zip Code)
    async function geocodeAddress(address) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
            const data = await res.json();
            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
        } catch (e) { console.error("Geocoding failed for", address); }
        return null;
    }

    // Calculate distances
    function processAndSortChurches(userLat, userLon) {
        lastUsedLat = userLat;
        lastUsedLon = userLon;
        document.getElementById('status').innerText = "Calculating distances...";
        
        for (let i = 0; i < churches.length; i++) {
            if (churches[i].lat && churches[i].lon) {
                churches[i].distance = getDistanceInMiles(userLat, userLon, churches[i].lat, churches[i].lon);
            } else {
                churches[i].distance = 9999; 
            }
        }

        churches.sort((a, b) => a.distance - b.distance);
        displayResults(userLat, userLon);
    }

    // Display List and Update Map
    function displayResults(userLat, userLon) {
        const listEl = document.getElementById('church-list');
        listEl.innerHTML = '';
        
        churchMarkers.forEach(m => map.removeLayer(m));
        churchMarkers = [];
        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.marker([userLat, userLon]).addTo(map)
            .bindPopup("<b>Your Location</b>").openPopup();
        
        let bounds = L.latLngBounds([[userLat, userLon]]);
        const maxRadius = parseInt(document.getElementById('radius-select').value, 10);
        let resultsFound = false;

        churches.forEach(church => {
            if (church.distance > maxRadius) return; 
            
            resultsFound = true;

            const li = document.createElement('li');
            li.className = 'church-item';
            li.innerHTML = `
                <h3>${church.name}</h3>
                <p>📍 ${church.address}</p>
                <p>📞 ${church.phone}</p>
                <p class="distance">${church.distance.toFixed(1)} miles away</p>
            `;
            listEl.appendChild(li);

            const marker = L.marker([church.lat, church.lon]).addTo(map)
                .bindPopup(`<b>${church.name}</b><br>${church.address}<br>${church.phone}`);
            churchMarkers.push(marker);
            
            bounds.extend([church.lat, church.lon]);
        });

        if (resultsFound) {
            map.fitBounds(bounds, { padding: [30, 30] });
            document.getElementById('status').innerText = `Displaying churches within ${maxRadius} miles.`;
        } else {
            map.setView([userLat, userLon], 11);
            listEl.innerHTML = `<li class="no-results">No churches found within ${maxRadius} miles of this location.</li>`;
            document.getElementById('status').innerText = "Search complete.";
        }
    }

    // Re-filter when radius dropdown changes
    document.getElementById('radius-select').addEventListener('change', () => {
        if (lastUsedLat !== null && lastUsedLon !== null) {
            displayResults(lastUsedLat, lastUsedLon);
        }
    });

    function useMyLocation() {
        document.getElementById('status').innerText = "Locating you...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    processAndSortChurches(position.coords.latitude, position.coords.longitude);
                },
                () => { document.getElementById('status').innerText = "Location access denied. Please type an address."; }
            );
        } else {
            document.getElementById('status').innerText = "Geolocation not supported by this browser.";
        }
    }

    async function useManualLocation() {
        const query = document.getElementById('manual-location').value;
        if (!query) return;
        document.getElementById('status').innerText = "Searching for location...";
        
        const coords = await geocodeAddress(query);
        if (coords) {
            processAndSortChurches(coords.lat, coords.lon);
        } else {
            document.getElementById('status').innerText = "Could not find that location. Try a different city or zip code.";
        }
    }

    function getDistanceInMiles(lat1, lon1, lat2, lon2) {
        const R = 3958.8; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    window.onload = () => {
        initMap();
        fetchChurchData();
    };
</script>

</body>
</html>
